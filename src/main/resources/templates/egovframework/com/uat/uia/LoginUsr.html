<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <title>로그인 / Login</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .login-box { max-width: 320px; margin: 60px auto; border: 1px solid #ccc; padding: 24px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 4px; }
    input[type=text], input[type=password] { width: 100%; padding: 6px; box-sizing: border-box; }
    .btn { width: 100%; padding: 8px; cursor: pointer; }
    .hint { margin-top: 16px; font-size: 12px; color: #666; }
  </style>
</head>
<body>

  <div class="login-box">
    <h2>로그인 / Login</h2>

    <!-- th:action + method="post" → Spring Security 가 hidden _csrf 입력을 자동으로 추가한다 -->
    <form th:action="@{/login/action.do}" method="post" th:object="${loginVO}">
      <div class="form-group">
        <label for="id">아이디 / ID</label>
        <input type="text" th:field="*{id}" autocomplete="username" autofocus/>
      </div>
      <div class="form-group">
        <label for="password">비밀번호 / Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password"/>
      </div>
      <button type="submit" class="btn">로그인 / Login</button>
    </form>

    <p class="hint">Practice account: admin / practice1234</p>
  </div>

  <!-- 로그인 실패 메시지 (th:inline 은 값을 JS 문자열로 안전하게 이스케이프) -->
  <script th:if="${loginMessage != null and loginMessage != ''}" th:inline="javascript">
    alert([[${loginMessage}]]);
  </script>

</body>
</html>
